<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>__DESIGN_CSS__</style>
</head>
<body class="m-0 bg-page font-body text-foreground">

<div class="mx-auto max-w-[1280px] px-4 pb-16">
<header class="intro">
  <h1>__TITLE__</h1>
  <p>__INTRO__ Tap <b>Correct</b>, or <b>Needs fixing</b> and say what is wrong. Everything saves as you go.__SOURCE_NOTE__</p>
  <p class="notice" id="notice"></p>
</header>
</div>

<div class="bar"><div class="bar-in">
  <div class="counts" aria-live="polite">
    <span><b id="c-done">0</b> / __TOTAL__ reviewed</span>
    <span class="c-ok"><b id="c-ok">0</b> correct</span>
    <span class="c-fix"><b id="c-fix">0</b> to fix</span>
  </div>
  <div class="filters" role="group" aria-label="Filter">
    <button type="button" id="f-all" data-f="all" aria-pressed="true">All</button>
    <button type="button" id="f-todo" data-f="todo" aria-pressed="false">To review</button>
    <button type="button" id="f-fix" data-f="fix" aria-pressed="false">Needs fixing</button>
  </div>
  <form class="jump" id="jump">
    <label for="jump-n">Go to #</label>
    <input id="jump-n" type="number" min="1" max="__TOTAL__" inputmode="numeric">
    <button type="submit" id="jump-go">Go</button>
  </form>
</div></div>

<main class="mx-auto max-w-[1280px] px-4 pb-16">
<div class="grid" id="grid">
<!--CARDS-->
<p class="empty" id="empty">Nothing here for this filter.</p>
</div>
</main>

<script>
(async () => {
  const cards = [...document.querySelectorAll('.card')];
  const byId = new Map(cards.map(c => [c.dataset.id, c]));
  const state = new Map();      // id -> {status, note}
  const dirty = new Set();      // ids with unsaved local edits
  let filter = 'all';
  const $ = id => document.getElementById(id);

  function paint(card) {
    const s = state.get(card.dataset.id) || {status: '', note: ''};
    card.dataset.state = s.status || '';
    card.querySelector('.ok').setAttribute('aria-pressed', s.status === 'ok');
    card.querySelector('.fix').setAttribute('aria-pressed', s.status === 'fix');
    const ta = card.querySelector('textarea');
    if (document.activeElement !== ta && !dirty.has(card.dataset.id)) ta.value = s.note || '';
  }
  function counts() {
    let ok = 0, fix = 0;
    for (const s of state.values()) { if (s.status === 'ok') ok++; else if (s.status === 'fix') fix++; }
    $('c-ok').textContent = ok; $('c-fix').textContent = fix; $('c-done').textContent = ok + fix;
  }
  function applyFilter() {
    let shown = 0;
    for (const c of cards) {
      const st = c.dataset.state;
      const vis = filter === 'all' || (filter === 'todo' && !st) || (filter === 'fix' && st === 'fix');
      c.hidden = !vis; if (vis) shown++;
    }
    for (const h of document.querySelectorAll('h2.sec')) {
      let el = h.nextElementSibling, any = false;
      while (el && el.classList.contains('card')) { if (!el.hidden) { any = true; break; } el = el.nextElementSibling; }
      h.hidden = !any;
    }
    $('empty').style.display = shown ? 'none' : 'block';
  }

  document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f;
    document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
    applyFilter();
  }));
  $('jump').addEventListener('submit', e => {
    e.preventDefault();
    const c = $('p' + parseInt($('jump-n').value, 10));
    if (!c) return;
    if (c.hidden) { filter = 'all'; document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === 'all')); applyFilter(); }
    c.scrollIntoView({block: 'start'});
    c.querySelector('.ok').focus({preventScroll: true});
  });

  const db = window.claude ? await claude.use('db').catch(() => null) : null;
  const col = db ? db.collection('corrections') : null;
  if (!col) {
    const n = $('notice');
    n.textContent = 'Saving is unavailable in this view (signed out or not permitted). You can still read every card.';
    n.style.display = 'block';
  }

  // One write in flight per doc; later edits coalesce into the next write.
  const inflight = new Map(), queued = new Set();
  async function save(id) {
    if (!col) return;
    if (inflight.get(id)) { queued.add(id); return; }
    inflight.set(id, true);
    const card = byId.get(id), msg = card.querySelector('.saved');
    const s = state.get(id) || {status: '', note: ''};
    msg.textContent = 'Saving…';
    try {
      await col.doc(id).set({status: s.status || '', note: s.note || '', n: Number(card.id.slice(1)), at: Date.now()});
      const current = state.get(id) || {status:'', note:''};
      const matches = current.status === s.status && current.note === s.note;
      if (matches && !queued.has(id)) { dirty.delete(id); msg.textContent = 'Saved'; }
      else { msg.textContent = 'Unsaved changes'; }
    } catch (e) {
      msg.textContent = 'Not saved: ' + (e && e.code === 'permission_denied' ? 'no write permission' : 'try again');
    } finally {
      inflight.delete(id);
      if (queued.delete(id)) save(id);
    }
  }

  const timers = new Map();
  for (const card of cards) {
    const id = card.dataset.id;
    card.querySelectorAll('.verdict button').forEach(b => b.addEventListener('click', () => {
      const cur = state.get(id) || {status: '', note: ''};
      const v = cur.status === b.dataset.v ? '' : b.dataset.v;
      dirty.add(id);
      state.set(id, {...cur, status: v});
      paint(card); counts(); applyFilter(); save(id);
      if (v === 'fix') card.querySelector('textarea').focus();
    }));
    const ta = card.querySelector('textarea');
    ta.addEventListener('input', () => {
      dirty.add(id);
      const cur = state.get(id) || {status: '', note: ''};
      const status = cur.status || (ta.value.trim() ? 'fix' : '');
      state.set(id, {status, note: ta.value});
      paint(card); counts();
      clearTimeout(timers.get(id));
      timers.set(id, setTimeout(() => save(id), 700));
    });
    ta.addEventListener('blur', () => { if (timers.has(id) && dirty.has(id)) { clearTimeout(timers.get(id)); save(id); } applyFilter(); });
  }

  if (col) {
    col.onSnapshot(snap => {
      for (const d of snap.docs) {
        if (!byId.has(d.id) || dirty.has(d.id)) continue;
        const data = d.data() || {};
        state.set(d.id, {status: data.status || '', note: data.note || ''});
        paint(byId.get(d.id));
      }
      counts(); applyFilter();
    }, () => {
      const n = $('notice');
      n.textContent = 'Lost the connection to saved answers. Reload the page to continue.';
      n.style.display = 'block';
    });
  }
})();
</script>

</body>
</html>
